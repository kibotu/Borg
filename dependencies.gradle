ext {
    // refresh gradle dependencies: ./gradlew build --refresh-dependencies
    minSdkVer = 23

    compileSdkVer = 36
    buildToolsVer = "36.0.0"
    targetSdkVer = 36

    // @see https://mvnrepository.com/artifact/org.jetbrains.kotlin/kotlin-stdlib-jdk8
    kotlinVersion = "2.4.10"

    isJitpack = System.getenv("JITPACK") == "true"

    println "Compile Version: $compileSdkVer"
    println "Min SDK Version: $minSdkVer"
    println "Target SDK Version: $targetSdkVer"
    println "Kotlin: $kotlinVersion"
    println "Version Name: $version"

    plugins = [
            // https://mvnrepository.com/artifact/com.vanniktech/gradle-maven-publish-plugin
            "com.vanniktech:gradle-maven-publish-plugin"                         : "0.37.0",
            // https://mvnrepository.com/artifact/com.android.tools.build/gradle?repo=google
            "com.android.tools.build:gradle"                                     : "9.3.1",
            "org.jetbrains.kotlin:kotlin-gradle-plugin"                         : "$kotlinVersion",
            "org.jetbrains.kotlin:compose-compiler-gradle-plugin"               : "$kotlinVersion",
            // https://github.com/google/ksp#supported-libraries
            // https://mvnrepository.com/artifact/com.google.devtools.ksp/com.google.devtools.ksp.gradle.plugin?repo=central
            "com.google.devtools.ksp:com.google.devtools.ksp.gradle.plugin": "2.3.10",
    ]

    libs = [
            // AndroidX
            // https://mvnrepository.com/artifact/androidx.core/core-ktx
            "androidx.core:core-ktx"                          : "1.19.0",
            // https://mvnrepository.com/artifact/androidx.lifecycle/lifecycle-runtime-ktx
            "androidx.lifecycle:lifecycle-runtime-ktx"        : "2.11.0",
            // https://mvnrepository.com/artifact/androidx.activity/activity-compose
            "androidx.activity:activity-compose"              : "1.13.0",

            // Compose
            // https://mvnrepository.com/artifact/androidx.compose/compose-bom
            "androidx.compose:compose-bom"                    : "2026.06.01",
            "androidx.compose.ui:ui"                          : "",
            "androidx.compose.ui:ui-graphics"                 : "",
            "androidx.compose.ui:ui-tooling-preview"          : "",
            "androidx.compose.material3:material3"            : "",
            "androidx.compose.ui:ui-tooling"                  : "",
            "androidx.compose.ui:ui-test-manifest"            : "",
            "androidx.compose.ui:ui-test-junit4"              : "",

            // Dagger
            // https://mvnrepository.com/artifact/com.google.dagger/dagger-android-support
            "com.google.dagger:dagger-android-support"        : "2.60.1",
            "com.google.dagger:dagger-android"                : "2.60.1",
            "com.google.dagger:dagger-compiler"               : "2.60.1",
            "com.google.dagger:dagger-android-processor"      : "2.60.1",

            // Coroutines
            // https://mvnrepository.com/artifact/org.jetbrains.kotlinx/kotlinx-coroutines-core
            "org.jetbrains.kotlinx:kotlinx-coroutines-core"   : "1.11.0",
            "org.jetbrains.kotlinx:kotlinx-coroutines-android": "1.11.0",
            "org.jetbrains.kotlinx:kotlinx-coroutines-test"   : "1.11.0",

            // Testing
            "org.jetbrains.kotlin:kotlin-test-junit"          : "$kotlinVersion",
            "junit:junit"                                     : "4.13.2"
    ]

    desugaring = [
            // https://mvnrepository.com/artifact/com.android.tools/desugar_jdk_libs
            "com.android.tools:desugar_jdk_libs": "2.1.5"
    ]

    LIBRARIES = libs + desugaring

    getLibraryFromMap = { Map<String, String> map, String lib ->
        Map.Entry<String, String> libData = map.find { Map.Entry<String, String> entry -> entry["key"] == lib }

        def key = libData?.key
        def value = libData?.value

        return (value && value.toString().trim()) ? "${key}:${value}" : "${key}"
    }

    getLibrary = { String lib ->
        getLibraryFromMap(LIBRARIES, lib)
    }

    getPluginLibrary = { String lib ->
        getLibraryFromMap(plugins, lib)
    }
}